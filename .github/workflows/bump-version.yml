name: Auto-bump version

on:
  push:
    branches: [main]
    paths: [index.html]

permissions:
  contents: write

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, '[auto-version]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bump SamKill version in index.html
        run: |
          set -euo pipefail

          current=$(grep -oP 'SamKill \K[0-9]+\.[0-9]+' index.html | head -n1)
          if [ -z "$current" ]; then
            echo "No se encontró el texto 'SamKill X.X' en index.html, no se hace nada."
            exit 0
          fi

          major=$(echo "$current" | cut -d. -f1)
          minor=$(echo "$current" | cut -d. -f2)
          next="$major.$((minor + 1))"

          sed -i "s/SamKill $current/SamKill $next/" index.html
          echo "Versión actualizada: $current -> $next"

          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Sin cambios que commitear."
            exit 0
          fi
          git add index.html
          git commit -m "Auto-bump version to SamKill ${NEXT_VERSION} [auto-version]"
          git push
